    <h2>Send us an enquiry</h2>
    <p>Fill in the form below to ask about products or gaming services.</p>

   <form id="enquiryForm">

    <label for="name">Full Name:</label>
    <input type="text" id="name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" required>

    <label for="phone">Phone Number:</label>
    <input
        type="tel"
        id="phone"
        pattern="[0-9]{10}"
        placeholder="0123456789"
        required>

    <label for="product">Select Product:</label>

    <select id="product" required>
        <option value="">Choose a product</option>
        <option value="Xbox Series S">Xbox Series S</option>
        <option value="PlayStation 4 Slim">PlayStation 4 Slim</option>
        <option value="Controller">Controller</option>
        <option value="Racing Wheel">Racing Wheel</option>
    </select>

    <label for="message">Enquiry Details:</label>

    <textarea
        id="message"
        rows="5"
        minlength="10"
        required></textarea>

    <button type="submit">Submit Enquiry</button>

    </form>

    <p id="enquiryResponse"></p>

    <hr>

    <p>Contact: 069 916 9374</p>
    <p>Location: Siyabuswa B and Pretoria</p>
